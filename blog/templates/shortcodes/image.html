{% set resized_image = resize_image(path=path, height=350, op="fit_height") %}

<div class="figure">
    <img src="{{ resized_image.url }}" width="{{ resized_image.width }}" height="{{ resized_image.height }}" alt="{{ caption | default(value='') }}">
    {% if caption %}
    <p class="figure-caption">{{ caption | markdown | safe }}</p>
    {% endif %}
</div>
