<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>joseph li's website</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/site.css">
  <script>
    // Set the theme before first paint to avoid a flash of the wrong theme.
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>

<body>
  <button class="theme-toggle" aria-label="Toggle dark mode">🌘</button>
  <div class="content-container">
    <!-- Do not show back button on index page -->
    
    <a href="../" class="back-button" aria-label="Go back">⬅️</a>
    
    
<article>
  <h1 class="page-title">1984</h1>
  <p class="page-meta">
    2025-06-03<br>
    <small> 0 min </small>
  </p>
  <hr>
  
  
</article>

  </div>

  <script>
    const ThemeManager = {
      emojis: {
        light: '🌘',
        dark: '🌕'
      },

      init() {
        // The head script already set data-theme before first paint.
        this.setTheme(document.documentElement.getAttribute('data-theme'), false);

        // Follow system theme changes until the user picks a theme explicitly
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
          if (!localStorage.getItem('theme')) {
            this.setTheme(e.matches ? 'dark' : 'light', false);
          }
        });

        document.querySelector('.theme-toggle').addEventListener('click', () => this.toggle());
      },

      setTheme(theme, persist) {
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('.theme-toggle').textContent = this.emojis[theme];
        if (persist) {
          localStorage.setItem('theme', theme);
        }
      },

      toggle() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        this.setTheme(currentTheme === 'dark' ? 'light' : 'dark', true);
      }
    };

    ThemeManager.init();
  </script>
</body>

</html>
