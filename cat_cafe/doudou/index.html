  <script>
    const ThemeManager = {
      emojis: {
        light: '🌘',
        dark: '🌕'
      },

      init() {
        // The head script already set data-theme before first paint.
        this.setTheme(document.documentElement.getAttribute('data-theme'), false);

        // Follow system theme changes until the user picks a theme explicitly
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
          if (!localStorage.getItem('theme')) {
            this.setTheme(e.matches ? 'dark' : 'light', false);
          }
        });

        document.querySelector('.theme-toggle').addEventListener('click', () => this.toggle());
      },

      setTheme(theme, persist) {
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('.theme-toggle').textContent = this.emojis[theme];
        if (persist) {
          localStorage.setItem('theme', theme);
        }
      },

      toggle() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        this.setTheme(currentTheme === 'dark' ? 'light' : 'dark', true);
      }
    };

    ThemeManager.init();
  </script>
